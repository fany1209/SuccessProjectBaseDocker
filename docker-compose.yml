# docker-compose.yml — successProjectBase Development Environment
# Reemplazo completo de XAMPP con MariaDB 10.11

services:
  # ─── Nginx — Web Server ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: success_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - success_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: success_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:cached
      - composer_cache:/root/.composer/cache
    environment:
      COMPOSER_ALLOW_SUPERUSER: 1
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: success
      DB_USERNAME: success_user
      DB_PASSWORD: success_pass
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - success_network

  mysql:
    image: mariadb:10.11
    container_name: success_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: success
      MYSQL_USER: success_user
      MYSQL_PASSWORD: success_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./success.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - success_network

  node:
    image: node:20-alpine
    container_name: success_node
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html:cached
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - success_network

volumes:
  mysql_data:
    driver: local
  composer_cache:
    driver: local
  node_modules:
    driver: local

networks:
  success_network:
    driver: bridge
